[project]
name = "legalos-document"
version = "0.1.0"
description = "AI Legal OS - Document Service"
requires-python = ">=3.12"
dependencies = [
    "legalos-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
legalos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
