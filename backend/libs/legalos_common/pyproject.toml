[project]
name = "legalos-common"
version = "0.1.0"
description = "Shared library for AI Legal OS services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "cryptography>=43.0.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "redis>=5.1.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "tavily-python>=0.5.0",
    "qdrant-client>=1.11.0",
    "fastembed>=0.4.0",
    "neo4j>=5.24.0",
    "opensearch-py[async]>=2.7.0",
    "boto3>=1.35.0",
    "aiokafka>=0.11.0",
    "orjson>=3.10.0",
    "pyyaml>=6.0.0",
    "pyyaml>=6.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legalos_common"]
