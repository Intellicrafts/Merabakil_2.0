<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:{{ colors.header_bg }};border-bottom:3px solid {{ colors.primary }};">
  <tr>
    <td align="center" style="padding:28px 32px 24px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="padding-right:14px;vertical-align:middle;">
            <img src="{{ mark_url }}" alt="{{ brand_name }} mark" width="40" height="40" style="display:block;border:0;border-radius:10px;width:40px;height:40px;" />
          </td>
          <td style="vertical-align:middle;text-align:left;">
            <p style="margin:0;font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:22px;line-height:1.2;font-weight:700;color:{{ colors.text }};letter-spacing:-0.02em;">
              {{ brand_name }}
            </p>
            <p style="margin:4px 0 0;font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.3;font-weight:500;color:{{ colors.muted }};">
              Legal Help. Made Simple.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
