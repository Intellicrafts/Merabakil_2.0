<tr>
  <td style="padding:10px 0;border-bottom:1px solid {{ colors.border }};width:36px;vertical-align:top;">
    <span style="font-size:16px;line-height:1;">{{ icon }}</span>
  </td>
  <td style="padding:10px 8px 10px 0;border-bottom:1px solid {{ colors.border }};vertical-align:top;">
    <span style="display:block;font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:12px;color:{{ colors.muted }};">{{ label }}</span>
    <span style="display:block;font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:600;color:{{ colors.text }};margin-top:2px;">{{ value }}</span>
  </td>
</tr>
