<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px;">
  <tr>
    <td style="padding:6px 14px;border-radius:999px;background-color:{{ pill_bg }};border:1px solid {{ pill_border }};">
      <span style="font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:12px;font-weight:600;color:{{ pill_color }};letter-spacing:0.02em;">
        {{ pill_label }}
      </span>
    </td>
  </tr>
</table>
