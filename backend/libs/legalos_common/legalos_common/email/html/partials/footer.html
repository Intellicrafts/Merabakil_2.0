<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:{{ colors.background }};border-top:1px solid {{ colors.border }};">
  <tr>
    <td align="center" style="padding:24px 32px 32px;">
      <p style="margin:0 0 8px;font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:13px;line-height:1.5;color:{{ colors.muted }};">
        Questions? <a href="mailto:{{ support_email }}" style="color:{{ colors.primary }};text-decoration:none;font-weight:600;">{{ support_email }}</a>
      </p>
      <p style="margin:0 0 10px;font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.5;color:{{ colors.muted }};">
        {{ brand_name }} — Legal platform for India
      </p>
      <p style="margin:0 0 12px;font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.5;color:{{ colors.muted }};">
        <a href="{{ frontend_url }}/privacy" style="color:{{ colors.muted }};text-decoration:underline;">Privacy</a>
        &nbsp;·&nbsp;
        <a href="{{ frontend_url }}/terms" style="color:{{ colors.muted }};text-decoration:underline;">Terms</a>
      </p>
      <p style="margin:0;font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:11px;line-height:1.4;color:#9CA3AF;">
        © 2026 {{ brand_name }}. All rights reserved.
      </p>
    </td>
  </tr>
</table>
