[project]
name = "legalos-orchestrator"
version = "0.1.0"
description = "AI Legal OS - LangGraph multi-agent orchestrator"
requires-python = ">=3.12"
dependencies = [
    "legalos-common",
    "langgraph>=0.2.30",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
legalos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legalos_orchestrator"]
