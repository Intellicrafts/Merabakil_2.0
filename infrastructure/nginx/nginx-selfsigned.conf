# ---------------------------------------------------------------------------
# MeraBakil — NGINX HTTPS config with self-signed cert (IP-based access)
# Allows getUserMedia / voicebot to work before domain + Let's Encrypt is set up.
# Replace with nginx.conf once Certbot is configured for merabakil.in.
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default  upgrade;
    ""       close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/certs/merabakil.crt;
    ssl_certificate_key /etc/ssl/private/merabakil.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host       $host;
    proxy_set_header   X-Real-IP  $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_connect_timeout 10s;

    location /svc/auth/ {
        proxy_pass http://auth:8000/;
    }

    location /svc/search/ {
        proxy_pass http://search:8000/;
    }

    location /svc/research/ {
        proxy_pass http://research:8000/;
    }

    location /svc/marketplace/ {
        proxy_pass http://marketplace:8000/;
    }

    location / {
        proxy_pass http://frontend:3000;
    }
}
