# ---------------------------------------------------------------------------
# MeraBakil — NGINX HTTP-only config (pre-domain / IP-based access)
# Use this until merabakil.in domain + SSL cert are ready.
# Replace with nginx.conf once Certbot is set up.
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default  upgrade;
    ""       close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;   # accept any host / IP

    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host       $host;
    proxy_set_header   X-Real-IP  $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_connect_timeout 10s;

    location /svc/auth/ {
        proxy_pass http://auth:8000/;
    }

    location /svc/search/ {
        proxy_pass http://search:8000/;
    }

    location /svc/research/ {
        proxy_pass http://research:8000/;
    }

    location /svc/marketplace/ {
        proxy_pass http://marketplace:8000/;
    }

    location / {
        proxy_pass http://frontend:3000;
    }
}
