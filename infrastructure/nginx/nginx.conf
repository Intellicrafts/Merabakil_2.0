# ---------------------------------------------------------------------------
# MeraBakil — NGINX production config
# Domain: merabakil.in
# SSL: Let's Encrypt (Certbot). Run certbot before starting this container.
#
# WebSocket proxying: the voice live endpoint at
#   wss://merabakil.in/svc/research/api/v1/research/voice/live
# requires the Upgrade header and a long read timeout. Both are set below.
# ---------------------------------------------------------------------------

# Map $http_upgrade so we can set Connection correctly for WS vs HTTP.
map $http_upgrade $connection_upgrade {
    default  upgrade;
    ""       close;
}

# Redirect all HTTP → HTTPS (except Certbot ACME challenge)
server {
    listen 80;
    listen [::]:80;
    server_name merabakil.in www.merabakil.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://merabakil.in$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name merabakil.in www.merabakil.in;

    # Let's Encrypt certificate (issued by Certbot on the host)
    ssl_certificate     /etc/letsencrypt/live/merabakil.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/merabakil.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # www → non-www canonical redirect
    if ($host = www.merabakil.in) {
        return 301 https://merabakil.in$request_uri;
    }

    # Security headers
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy        strict-origin-when-cross-origin;

    # Default proxy settings (also apply to WebSocket connections)
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host       $host;
    proxy_set_header   X-Real-IP  $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Generous timeouts — voice sessions last minutes
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_connect_timeout 10s;

    # ── Backend API routes ────────────────────────────────────────────────
    # Strip the /svc/<name> prefix before forwarding so service routes
    # receive /api/v1/... as they expect.

    location /svc/auth/ {
        proxy_pass http://auth:8000/;
    }

    location /svc/search/ {
        proxy_pass http://search:8000/;
    }

    # Research service — handles both HTTP and WebSocket (voice live)
    location /svc/research/ {
        proxy_pass http://research:8000/;
    }

    location /svc/marketplace/ {
        proxy_pass http://marketplace:8000/;
    }

    # ── Frontend (Next.js) ───────────────────────────────────────────────
    location / {
        proxy_pass http://frontend:3000;

        # Next.js hot-reload WebSocket (harmless in prod, still works)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
