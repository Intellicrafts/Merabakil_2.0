# Application deployments + services. Datastores (Postgres, Qdrant, Neo4j,
# OpenSearch, Kafka, Redis, MinIO) are expected to be provided by managed
# offerings or their official operators/Helm charts in production.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: legalos
  labels: { app: auth }
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth }
    spec:
      containers:
        - name: auth
          image: ghcr.io/legalos/auth:latest
          ports: [{ containerPort: 8001 }]
          env:
            - { name: PORT, value: "8001" }
            - { name: RUN_MIGRATIONS, value: "true" }
            - { name: SERVICE_NAME, value: "auth-service" }
          envFrom:
            - configMapRef: { name: legalos-config }
            - secretRef: { name: legalos-secrets }
          readinessProbe:
            httpGet: { path: /ready, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: auth, namespace: legalos }
spec:
  selector: { app: auth }
  ports: [{ port: 8001, targetPort: 8001 }]
