<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="480" cy="120" r="140" fill="url(#orb)"/>
  <circle cx="160" cy="300" r="100" fill="url(#orb)"/>
  <!-- Scales -->
  <g transform="translate(200 60)">
    <path d="M120 40v140" stroke="url(#metal)" stroke-width="4" stroke-linecap="round"/>
    <path d="M50 70h140" stroke="url(#metal)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="120" cy="36" r="10" fill="url(#metal)"/>
    <path d="M50 70c0 34-28 62-52 70 24 8 52 36 52 70" stroke="url(#metal)" stroke-width="3.5" fill="url(#glow)"/>
    <path d="M190 70c0 34 28 62 52 70-24 8-52 36-52 70" stroke="url(#metal)" stroke-width="3.5" fill="url(#glow)"/>
    <rect x="88" y="180" width="64" height="14" rx="4" fill="url(#metal)"/>
  </g>
  <!-- Chat bubble -->
  <g transform="translate(420 210)">
    <rect x="0" y="0" width="140" height="92" rx="22" fill="#f8fafc" fill-opacity="0.12" stroke="url(#metal)" stroke-width="2"/>
    <path d="M28 92l-18 28 42-18" fill="#f8fafc" fill-opacity="0.12" stroke="url(#metal)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M28 36h84M28 52h64M28 68h48" stroke="#e2e8f0" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
