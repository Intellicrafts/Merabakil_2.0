name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        working-directory: backend
        run: |
          uv venv
          uv pip install ruff mypy pytest pytest-asyncio httpx
          uv pip install ./libs/legalos_common
          uv pip install ./orchestrator
          uv pip install ./services/auth ./services/knowledge-ingestion ./services/search ./services/research

      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .

      - name: Run test suites
        working-directory: backend
        run: uv run bash scripts/run_tests.sh

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend]
    strategy:
      matrix:
        include:
          - service: auth
            path: services/auth
            orchestrator: "false"
          - service: knowledge-ingestion
            path: services/knowledge-ingestion
            orchestrator: "false"
          - service: search
            path: services/search
            orchestrator: "false"
          - service: research
            path: services/research
            orchestrator: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backend.Dockerfile
          push: false
          build-args: |
            SERVICE_PATH=${{ matrix.path }}
            INSTALL_ORCHESTRATOR=${{ matrix.orchestrator }}
          tags: legalos-${{ matrix.service }}:ci
